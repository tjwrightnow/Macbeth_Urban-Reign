","Escena diez. El pasillo. Momentos después."],[213.25,"L","¿Por qué trajiste las armas? Tienen que quedarse allá. Regrésalas, y mancha de sangre a los guardias dormidos.","Escena diez. El pasillo. Momentos después."],[219.57,"M","No vuelvo a entrar. Me da miedo pensar en lo que hice. No me atrevo a verlo otra vez.","Escena diez. El pasillo. Momentos después."],[224.63,"L","¡Débil de voluntad! Dame las armas. Los dormidos y los muertos son solo como pinturas. Es el ojo de un niño el que le tiene miedo a un diablo pintado.","Escena diez. El pasillo. Momentos después."],[233.32,"N","Le arranca la pistola de la mano y regresa al cuarto de Duncan.","Escena diez. El pasillo. Momentos después."],[237.53,"L","Si todavía sangra, le pintaré la cara de oro rojo a los guardias. Porque tiene que parecer que fueron ellos.","Escena diez. El pasillo. Momentos después."],[243.86,"N","Macbeth se queda solo, agarrado de la mesa. Se mira las manos. Una sola gota de sangre cae al suelo.","Escena diez. El pasillo. Momentos después."],[251.4,"N","El cielo amanece gris. En la puerta de la mansión están Lennox y Macduff. Sus golpes retumban por toda la casa.","Escenas once a trece. El amanecer."],[258.49,"N","En la sala, Macbeth está sentado en el sofá, mirándose las manos. Su sudadera todavía tiene sangre, pero él ni lo nota. El peso del asesinato lo está ahogando.","Escenas once a trece. El amanecer."],[268.12,"N","En la cocina, Lady Macbeth se echa agua en la cara, obligándose a estar tranquila. Y los golpes en la puerta... se escuchan cada vez más fuertes.","Escenas once a trece. El amanecer."],[278.11,"N","El portero va tropezando hacia la puerta, medio borracho. Es un viejo cadenero de club, con una sudadera enorme, que pelea con las cerraduras.","Escena catorce. La puerta."],[286.63,"P","¡Pues sí que están tocando! Si un hombre fuera el portero del infierno, se cansaría de darle vuelta a la llave.","Escena catorce. La puerta."],[293.2,"P","¡Toc, toc, toc! ¿Quién es, en nombre de Belcebú?","Escena catorce. La puerta."],[295.97,"N","Abre la puerta. Entran Macduff y Lennox. Macduff, serio, con ojos que no se pierden nada. Lennox, joven y nervioso, mirando a todos lados.","Escena catorce. La puerta."],[304.93,"F","¿Tan tarde te acostaste, amigo, que todavía estás en la cama a esta hora?","Escena catorce. La puerta."],[309.3,"P","La verdad, señor, estuvimos de fiesta hasta que cantó el segundo gallo.","Escena catorce. La puerta."],[313.8,"N","Se ríe y se hace a un lado. Macduff y Lennox pasan de largo hacia adentro.","Escena catorce. La puerta."],[320.02,"N","Macbeth se levanta cuando entran, obligándose a parecer tranquilo.","Escena quince. La sala principal."],[324.47,"M","Buenos días a los dos.","Escena quince. La sala principal."],[326.3,"F","¿Ya se levantó el rey, noble señor?","Escena quince. La sala principal."],[328.63,"M","Todavía no.","Escena quince. La sala principal."],[329.86,"F","Me atreveré a despertarlo. Es mi deber.","Escena quince. La sala principal."],[332.45,"N","Macduff sale hacia el cuarto de Duncan. Macbeth lo mira irse, con la mandíbula apretada. Entra Lady Macbeth, acomodándose la bata, fingiendo sueño.","Escena quince. La sala principal."],[341.36,"LE","La noche ha estado salvaje. Donde nos quedamos, el viento tumbó las chimeneas. Y dicen que se escucharon lamentos en el aire. Gritos extraños de muerte.","Escena quince. La sala principal."],[349.97,"N","Y de pronto, un grito desde el pasillo. ¡Macduff regresa tropezando, con los ojos abiertos y la cara blanca!","Escena quince. La sala principal."],[356.83,"F","¡Oh, horror, horror, horror! ¡Ni la lengua ni el corazón pueden imaginarte ni nombrarte!","Escena quince. La sala principal."],[361.57,"N","Lady Macbeth se lleva la mano al pecho, como si estuviera en shock. Lennox se congela. Macbeth aprieta los dientes.","Escena quince. La sala principal."],[368.69,"F","¡El asesinato más sacrílego ha abierto el templo sagrado del Señor, y le ha robado la vida al edificio!","Escena quince. La sala principal."],[374.84,"M","¿Qué dices? ¿La vida?","Escena quince. La sala principal."],[376.46,"F","¿Hablas de su majestad?","Escena quince. La sala principal."],[378.2,"LE","Parece que fueron los de su cuarto. Tenían las manos y la cara manchadas de sangre. Y sus armas también, sin limpiar, sobre las almohadas.","Escena quince. La sala principal."],[385.8,"F","Oh, ya me arrepiento de mi furia. De haberlos matado.","Escena quince. La sala principal."],[388.89,"L","¡Ayúdenme! ¡Sáquenme de aquí!","Escena quince. La sala principal."],[390.76,"N","Ella se desmaya en el sofá. Lennox y el portero corren a ayudarla. Todo es caos. Y en medio de todo, Macbeth. Con la cara imposible de leer.","Escena quince. La sala principal."],[400.61,"N","El sol apenas sale, pintando de naranja apagado el skyline de Houston. La calle está tensa. Patrullas, camionetas de noticias, gente del North Side y del South Side murmurando en grupos.","Escena dieciséis. La calle frente al apartamento. De día."],[411.69,"N","En la reja ya hay un altar improvisado. Velas, botellas, fotos de Duncan. Ross y un viejo de la calle, un OG, miran todo desde un lado.","Escena dieciséis. La calle frente al apartamento. De día."],[419.85,"VJ","Setenta años recuerdo bien. Y en ese tiempo he visto horas terribles y cosas extrañas. Pero esta noche horrible hace parecer un juego todo lo que vi antes.","Escena dieciséis. La calle frente al apartamento. De día."],[429.66,"R","Ah, buen padre. Mira el cielo, como si estuviera molesto por lo que hizo el hombre, amenazando su escenario de sangre. El reloj dice que es de día, y sin embargo la noche oscura está ahorcando al sol.","Escena dieciséis. La calle frente al apartamento. De día."],[440.63,"N","El viejo señala una camioneta negra al otro lado de la calle. Adentro están Malcolm y Donalbain, los hijos de Duncan.","Escena dieciséis. La calle frente al apartamento. De día."],[447.85,"VJ","No es natural. Igual que lo que hicieron. El martes pasado, un halcón, orgulloso en lo más alto, fue cazado y muerto por un búho que caza ratones.","Escena dieciséis. La calle frente al apartamento. De día."],[458.38,"N","Los vidrios polarizados están un poco abajo. Malcolm mira por la ventana, tenso.","Escena diecisiete. Dentro de la camioneta."],[463.9,"MA","¿Qué vas a hacer? No nos juntemos con ellos. Fingir un dolor que no se siente es un trabajo fácil para el hombre falso. Yo me voy a Inglaterra.","Escena diecisiete. Dentro de la camioneta."],[471.8,"DO","Yo a Irlanda. Separados, nuestra suerte nos mantendrá más seguros. Donde estamos, hay puñales en las sonrisas de los hombres. Entre más cerca de la sangre, más cerca de la muerte.","Escena diecisiete. Dentro de la camioneta."],[481.8,"N","El motor ruge. La camioneta se aleja. Malcolm mira al frente con ojos fríos, y sube la ventana.","Escena diecisiete. Dentro de la camioneta."],[489.24,"N","Ross respira despacio, viendo desaparecer la camioneta.","Escena dieciocho. La calle."],[493.15,"R","¡Otra vez contra la naturaleza!","Escena dieciocho. La calle."],[495.36,"VJ","Que la bendición de Dios vaya contigo, y con todos los que quieren hacer bien del mal, y amigos de los enemigos.","Escena dieciocho. La calle."],[502.47,"N","Ross voltea hacia la casa. Desde adentro se escuchan los cánticos. Macbeth está a punto de ser nombrado el nuevo rey.","Escena dieciocho. La calle."]]},{"t":"CAPITULO 3","d":780.58,"c":[[0.0,"N","Ventanales de piso a techo sobre Houston. Cuero negro, cromo, y en la pared una placa dorada enorme: Northside Records. Macbeth, detrás de un escritorio de vidrio, golpea la superficie con los dedos. Banquo está frente a él, tenso, con los brazos cruzados.","Escena diecinueve. La oficina del penthouse. De día."],[15.01,"M","¿Vas a salir esta tarde?","Escena diecinueve. La oficina del penthouse. De día."],[16.92,"B","Sí, mi señor.","Escena diecinueve. La oficina del penthouse. De día."],[18.19,"M","Si no, te habríamos pedido tu buen consejo en la reunión de hoy. Pero lo dejaremos para mañana.","Escena diecinueve. La oficina del penthouse. De día."],[23.9,"N","Sonríe. Demasiado amable. Banquo no le devuelve la sonrisa.","Escena diecinueve. La oficina del penthouse. De día."],[28.01,"M","¿Vas lejos?","Escena diecinueve. La oficina del penthouse. De día."],[29.2,"B","Tan lejos, mi señor, como para llenar el tiempo de aquí a la cena. Si mi caballo no corre mejor, tendré que pedirle prestada a la noche una o dos horas oscuras.","Escena diecinueve. La oficina del penthouse. De día."],[38.57,"M","¡No faltes a nuestra fiesta!","Escena diecinueve. La oficina del penthouse. De día."],[40.62,"B","Mi señor, no faltaré.","Escena diecinueve. La oficina del penthouse. De día."],[42.49,"N","Banquo le echa una última mirada y se va. En cuanto se cierra la puerta, Macbeth suspira, y sus dedos golpean más rápido. Se para frente a la ventana y mira su reflejo.","Escena diecinueve. La oficina del penthouse. De día."],[52.77,"M","Ser así no es nada. Hay que serlo con seguridad. Mis miedos de Banquo se clavan hondo. En su naturaleza real reina algo que hay que temer. Se atreve a mucho. Y con ese valor sin miedo, tiene una sabiduría que lo guía para actuar seguro.","Escena diecinueve. La oficina del penthouse. De día."],[66.72,"M","No hay nadie más que él a quien yo le tema. Y frente a él, mi espíritu se hace chiquito, como dicen que el de Marco Antonio se hacía chiquito frente a César.","Escena diecinueve. La oficina del penthouse. De día."],[75.69,"M","La sangre de Banquo es una amenaza. Fleance es el que sigue. La corona es mía, pero mis hijos nunca la van a heredar.","Escena diecinueve. La oficina del penthouse. De día."],[82.66,"M","¡Por los hijos de Banquo me ensucié la mente! ¡Por ellos maté al bondadoso Duncan! Envenené mi paz, y le entregué mi alma eterna al enemigo de todos los hombres, ¿solo para hacerlos reyes? ¿Reyes, la semilla de Banquo? ¡Antes que eso, que venga el destino a pelear conmigo!","Escena diecinueve. La oficina del penthouse. De día."],[97.28,"N","¡El vaso se revienta en su mano! La decisión está tomada.","Escena diecinueve. La oficina del penthouse. De día."],[101.27,"N","Varios momentos después. Tocan la puerta. Entran dos hombres de la calle, duros, vestidos de negro.","Escena diecinueve. La oficina del penthouse. De día."],[107.52,"M","¿No fue ayer que hablamos?","Escena diecinueve. La oficina del penthouse. De día."],[109.4,"A1","Así fue, si le parece a su alteza.","Escena diecinueve. La oficina del penthouse. De día."],[111.71,"M","¿Tienen tanta paciencia en su naturaleza que pueden dejar pasar esto?","Escena diecinueve. La oficina del penthouse. De día."],[116.1,"N","Se miran entre ellos. Saben de qué se trata. Macbeth ya los había puesto en contra de Banquo.","Escena diecinueve. La oficina del penthouse. De día."],[121.89,"A2","Somos hombres, mi señor.","Escena diecinueve. La oficina del penthouse. De día."],[123.79,"M","Sí, en la lista pasan por hombres. Igual que los sabuesos, los galgos, los perros callejeros y los lobos a medias, todos se llaman perros. Pero la lista de valor distingue al rápido, al lento, al astuto, al que cuida la casa, y al que caza.","Escena diecinueve. La oficina del penthouse. De día."],[137.29,"M","Ahora, si ustedes tienen un lugar en esa lista, y no están en lo más bajo de los hombres, díganlo. Y yo les pondré en el pecho un negocio que, cuando lo cumplan, les quitará de encima a su enemigo.","Escena diecinueve. La oficina del penthouse. De día."],[147.94,"A1","Haremos, mi señor, lo que usted nos ordene.","Escena diecinueve. La oficina del penthouse. De día."],[150.76,"M","Está decidido. Banquo, si tu alma ha de encontrar el cielo, lo encontrará esta noche.","Escena diecinueve. La oficina del penthouse. De día."],[155.99,"N","Y sonríe. Una sonrisa malvada.","Escena diecinueve. La oficina del penthouse. De día."],[159.79,"N","Pisos de mármol, paredes oscuras. Lady Macbeth está sola en un sillón de cuero, con una copa de vino. En la televisión, sin sonido, pasan el funeral de Duncan. La ciudad está de luto. Entra Macbeth.","Escena veinte. El penthouse. De noche."],[171.54,"L","¿Qué pasa, mi señor? ¿Por qué estás solo, con tus peores pensamientos como compañía? Las cosas que no tienen remedio no deberían importar. Lo hecho, hecho está.","Escena veinte. El penthouse. De noche."],[180.73,"M","Herimos a la serpiente, pero no la matamos. Se curará y volverá a ser ella misma, y nuestra pobre maldad seguirá en peligro de sus colmillos.","Escena veinte. El penthouse. De noche."],[189.02,"L","Ándale, mi señor. Suaviza esa cara. Esta noche sé alegre y brillante con tus invitados.","Escena veinte. El penthouse. De noche."],[194.45,"M","Así será, mi amor. Y tú también. Pon tu atención en Banquo. Hónralo con los ojos y con la lengua. Tenemos que lavar nuestros honores en ríos de halagos, y hacer de nuestra cara una máscara para el corazón.","Escena veinte. El penthouse. De noche."],[205.94,"L","Tienes que dejar esto.","Escena veinte. El penthouse. De noche."],[207.6,"M","¡Oh, mi mente está llena de escorpiones, querida esposa! Tú sabes que Banquo y su Fleance siguen vivos.","Escena veinte. El penthouse. De noche."],[213.64,"L","Pero no van a vivir para siempre.","Escena veinte. El penthouse. De noche."],[215.95,"M","Eso es un consuelo. Se les puede atacar. Así que alégrate. Antes de que vuele el murciélago, antes de que el escarabajo toque con su zumbido la campana de la noche, se hará algo terrible.","Escena veinte. El penthouse. De noche."],[226.76,"L","¿Qué se va a hacer?","Escena veinte. El penthouse. De noche."],[228.27,"M","Quédate inocente de saberlo, mi vida, hasta que aplaudas lo hecho.","Escena veinte. El penthouse. De noche."],[232.2,"N","Un silencio tenso. Le besa la frente. Pero ella no se relaja.","Escena veinte. El penthouse. De noche."],[237.7,"N","La luna ilumina el balcón. Macbeth enciende un cigarro y echa el humo a la noche.","Escena veintiuno. El balcón."],[242.76,"M","Ven, noche que ciegas. Venda el ojo tierno del día compasivo, y con tu mano invisible y sangrienta, rompe en pedazos el gran lazo que me tiene pálido.","Escena veintiuno. El balcón."],[252.01,"N","Lanza el cigarro al aire y mira caer la brasa.","Escena veintiuno. El balcón."],[255.41,"M","La luz se hace espesa, y el cuervo vuela hacia el bosque. Las cosas buenas del día empiezan a dormirse, mientras los agentes negros de la noche se despiertan para cazar a sus presas.","Escena veintiuno. El balcón."],[267.29,"N","Cae una llovizna. El pavimento brilla. Bajo un farol espera una camioneta negra, con el motor encendido. Adentro, los dos asesinos revisan sus armas en silencio.","Escena veintidós. Una calle oscura de Houston. De noche."],[277.21,"N","Banquo y su hijo Fleance salen de un estudio de grabación, Southside Records. Banquo lleva una cadena de oro pesada. Fleance, joven y nervioso, camina detrás de él. Banquo mira al cielo.","Escena veintidós. Una calle oscura de Houston. De noche."],[288.51,"B","Va a llover esta noche.","Escena veintidós. Una calle oscura de Houston. De noche."],[290.44,"N","Los asesinos bajan de la camioneta. El primero sonríe y saca su pistola.","Escena veintidós. Una calle oscura de Houston. De noche."],[295.55,"A1","¡Que caiga!","Escena veintidós. Una calle oscura de Houston. De noche."],[296.69,"N","¡Estallan los disparos! Banquo empuja a Fleance al suelo mientras las balas rompen el aire. ¡Vidrios rotos! ¡Alarmas de carros! Banquo retrocede, agarrándose el pecho. La sangre se extiende por su camiseta blanca.","Escena veintidós. Una calle oscura de Houston. De noche."],[309.77,"B","¡Oh, traición! ¡Huye, Fleance, huye, huye, huye! ¡Tú puedes vengarme! ¡Ah, maldito!","Escena veintidós. Una calle oscura de Houston. De noche."],[314.13,"N","Cae de rodillas. Un último respiro. Y luego, silencio. El segundo asesino se asoma al callejón. Fleance ya no está.","Escena veintidós. Una calle oscura de Houston. De noche."],[321.54,"A2","Perdimos la mejor mitad del trabajo.","Escena veintidós. Una calle oscura de Houston. De noche."],[324.24,"A1","Bueno, vámonos, y digamos cuánto se hizo.","Escena veintidós. Una calle oscura de Houston. De noche."],[326.93,"N","Saltan a la camioneta. Las llantas chillan. Y se pierden en la noche.","Escena veintidós. Una calle oscura de Houston. De noche."],[332.59,"N","Música, humo y luces. Una larga mesa de mármol negro, llena de champaña, puros y comida fina. Macbeth, en traje negro de diseñador, preside la mesa. Lady Macbeth está a su lado, perfecta, pero vigilándolo.","Escena veintitrés. El salón privado del Club Plex. De noche."],[345.34,"N","Gente del North Side y del South Side se mezcla. Sonrisas falsas. Saludos tensos. Esta fiesta no es solo una fiesta. Es una demostración de poder. El primer asesino entra entre la gente y le susurra al oído.","Escena veintitrés. El salón privado del Club Plex. De noche."],[357.91,"M","Tienes sangre en la cara.","Escena veintitrés. El salón privado del Club Plex. De noche."],[359.64,"A1","Entonces es de Banquo.","Escena veintitrés. El salón privado del Club Plex. De noche."],[361.53,"M","¿Ya está despachado?","Escena veintitrés. El salón privado del Club Plex. De noche."],[363.23,"A1","Mi señor, le cortamos la garganta. Eso hice por él.","Escena veintitrés. El salón privado del Club Plex. De noche."],[366.58,"M","Eres el mejor de los asesinos. Pero también es bueno el que hizo lo mismo con Fleance. Si fuiste tú, no tienes igual.","Escena veintitrés. El salón privado del Club Plex. De noche."],[373.55,"A1","Mi señor... Fleance se escapó.","Escena veintitrés. El salón privado del Club Plex. De noche."],[375.75,"N","La mano de Macbeth aprieta el vaso. Su mandíbula se tensa.","Escena veintitrés. El salón privado del Club Plex. De noche."],[379.82,"M","Entonces vuelve mi ataque. Si no, habría sido perfecto. Entero como el mármol, firme como la roca, libre como el aire. Pero ahora estoy encerrado, encajonado, amarrado a dudas y miedos insolentes.","Escena veintitrés. El salón privado del Club Plex. De noche."],[391.82,"L","Mi señor, no estás animando la fiesta. Una cena donde no se le da la bienvenida a la gente parece una cena vendida. Para comer, mejor en casa. Fuera de casa, la salsa es la ceremonia.","Escena veintitrés. El salón privado del Club Plex. De noche."],[402.85,"M","¡Dulce recordatorio! ¡Que la buena digestión acompañe al apetito, y la salud a los dos!","Escena veintitrés. El salón privado del Club Plex. De noche."],[408.07,"N","Todos levantan sus copas. Macbeth vuelve la vista a su plato, y se le corta la respiración. Al otro lado de la mesa, en una silla vacía, está sentado Banquo. Con la camisa empapada de sangre. Con sus ojos muertos clavados en Macbeth.","Escena veintitrés. El salón privado del Club Plex. De noche."],[421.73,"N","La música se distorsiona. El cuarto se nubla. Macbeth se agarra de la mesa, mirando el aire vacío.","Escena veintitrés. El salón privado del Club Plex. De noche."],[427.9,"M","¡No puedes decir que fui yo! ¡No me sacudas tu cabello ensangrentado!","Escena veintitrés. El salón privado del Club Plex. De noche."],[432.22,"N","La fiesta se congela. Todos lo miran. Lady Macbeth se ríe, ligera, tapándolo todo.","Escena veintitrés. El salón privado del Club Plex. De noche."],[437.68,"L","Siéntense, queridos amigos. Mi esposo es así seguido, desde que era joven. Por favor, quédense sentados. El ataque es de un momento. En un instante va a estar bien.","Escena veintitrés. El salón privado del Club Plex. De noche."],[447.28,"M","Si los cementerios y las tumbas nos regresan a los que enterramos, entonces nuestros monumentos deberían ser los estómagos de los buitres.","Escena veintitrés. El salón privado del Club Plex. De noche."],[455.62,"R","¿Qué cosas ve, mi señor?","Escena veintitrés. El salón privado del Club Plex. De noche."],[457.44,"L","Piensen en esto, buenos amigos, solo como una costumbre. No es otra cosa. Solo arruina el gusto del momento.","Escena veintitrés. El salón privado del Club Plex. De noche."],[463.86,"N","¡Macbeth golpea la mesa y se levanta! La silla raspa el piso. Le grita a la silla vacía.","Escena veintitrés. El salón privado del Club Plex. De noche."],[469.62,"M","¡Fuera! ¡Quítate de mi vista! ¡Que te esconda la tierra! ¡Tus huesos están vacíos, tu sangre está fría! ¡No hay vida en esos ojos con los que me miras!","Escena veintitrés. El salón privado del Club Plex. De noche."],[477.98,"N","Los invitados se miran incómodos. Algunos llevan la mano a sus armas. Lady Macbeth le aprieta la muñeca.","Escena veintitrés. El salón privado del Club Plex. De noche."],[484.54,"L","Acabaste con la alegría. Rompiste la fiesta con el desorden más asombroso.","Escena veintitrés. El salón privado del Club Plex. De noche."],[489.29,"N","El fantasma desaparece. A Macbeth le tiemblan las manos. Intenta reírse, pero suena hueco.","Escena veintitrés. El salón privado del Club Plex. De noche."],[495.13,"M","¿Pueden existir cosas así, y pasarnos por encima como una nube de verano, sin que nos asombremos?","Escena veintitrés. El salón privado del Club Plex. De noche."],[501.1,"L","¡Buenas noches a todos!","Escena veintitrés. El salón privado del Club Plex. De noche."],[502.92,"N","Nadie duda. Todos salen murmurando. La música se apaga. Macbeth se desploma en su silla.","Escena veintitrés. El salón privado del Club Plex. De noche."],[508.56,"M","Quiere sangre. Dicen que la sangre llama a la sangre. Se han visto piedras moverse y árboles hablar. Y los cuervos y las urracas han delatado al asesino más escondido.","Escena veintitrés. El salón privado del Club Plex. De noche."],[518.36,"L","Te falta lo que da sabor a toda la vida. El sueño.","Escena veintitrés. El salón privado del Club Plex. De noche."],[521.41,"M","Ven. Vamos a dormir.","Escena veintitrés. El salón privado del Club Plex. De noche."],[524.38,"N","Una bodega abandonada. Letreros de neón parpadean afuera y entran por las ventanas rotas. Sobre una mesa hay dinero, teléfonos desechables y cosas peores.","Escena veinticuatro. Una bodega del North Side. De noche."],[534.22,"N","En las sombras están las tres brujas. En este mundo son místicas, reinas del vudú, profetas de la calle. El incienso sube en espirales. La primera tira los dados. Ojos de serpiente.","Escena veinticuatro. Una bodega del North Side. De noche."],[545.06,"W1","¿Qué pasa, Hécate? Te ves enojada.","Escena veinticuatro. Una bodega del North Side. De noche."],[547.66,"N","Hécate sale a la luz, envuelta en túnicas, con anillos de oro. Pone una carta del tarot sobre la mesa. La Torre. La destrucción.","Escena veinticuatro. Una bodega del North Side. De noche."],[555.24,"H","¿Y no tengo razón, viejas brujas? Insolentes y atrevidas, ¿cómo se atrevieron a comerciar con Macbeth en acertijos y asuntos de muerte, y a mí, la dueña de sus hechizos, nunca me llamaron para hacer mi parte?","Escena veinticuatro. Una bodega del North Side. De noche."],[568.43,"H","Y lo peor de todo es que todo lo que hicieron fue por un hijo descarriado, rencoroso y furioso, que como todos los demás, ama por sus propios fines, no por ustedes.","Escena veinticuatro. Una bodega del North Side. De noche."],[578.41,"N","Lanza otra carta. Cae El Diablo.","Escena veinticuatro. Una bodega del North Side. De noche."],[580.98,"H","Pero arréglenlo ahora. Váyanse, y en el pozo del Aqueronte, encuéntrenme en la mañana. Allá vendrá él a conocer su destino. Preparen sus hechizos, sus amuletos, y todo lo demás.","Escena veinticuatro. Una bodega del North Side. De noche."],[592.31,"H","Porque ustedes saben bien que la confianza es el peor enemigo de los mortales.","Escena veinticuatro. Una bodega del North Side. De noche."],[597.3,"N","Mueve la mano. Y el cuarto se llena de sombra.","Escena veinticuatro. Una bodega del North Side. De noche."],[601.63,"N","Humo de puro. En la televisión, otra noticia de un asesinato. Los viejos socios de Duncan juegan póker, susurrando. Lennox se recarga en su silla. Frente a él, un Señor, aliado de Duncan, que ve el ascenso de Macbeth con sospecha.","Escena veinticinco. El cuarto de atrás de un club del South Side. De noche."],[615.53,"LE","Mi antiguo jefe, que Dios lo bendiga, era demasiado bueno. Y sin embargo, está muerto. Y Banquo también. ¿Dos reyes bajo la tierra? ¿Y Fleance desaparecido? Eso no puede ser casualidad.","Escena veinticinco. El cuarto de atrás de un club del South Side. De noche."],[626.17,"LE","La gente dice que fue su hijo. Que huyó, igual que los hijos de Duncan. Pero entre tú y yo... ¿quién gana con todo esto?","Escena veinticinco. El cuarto de atrás de un club del South Side. De noche."],[632.57,"LE","Macbeth anda muy generoso últimamente. Tirando dinero como si creciera en los árboles. Y sin embargo, qué pena, que los hombres honestos sigan cayendo muertos.","Escena veinticinco. El cuarto de atrás de un club del South Side. De noche."],[641.76,"SR","Eso es lo que dicen en la calle. Dicen que han visto a Malcolm. Reuniéndose con los grandes.","Escena veinticinco. El cuarto de atrás de un club del South Side. De noche."],[647.16,"SR","¿Y Macduff? No ha regresado a su casa. Parece que olió algo podrido en el aire.","Escena veinticinco. El cuarto de atrás de un club del South Side. De noche."],[651.92,"LE","¿Y dónde está Macbeth en todo esto?","Escena veinticinco. El cuarto de atrás de un club del South Side. De noche."],[654.26,"SR","Cerrando su cuadra. Doblando la seguridad. Mirando por encima del hombro.","Escena veinticinco. El cuarto de atrás de un club del South Side. De noche."],[658.73,"LE","Entonces que Dios bendiga a Macduff. Ojalá regrese con un ejército.","Escena veinticinco. El cuarto de atrás de un club del South Side. De noche."],[662.93,"N","Los dos hombres se miran. El South Side no se traga las mentiras de Macbeth. Viene la guerra.","Escena veinticinco. El cuarto de atrás de un club del South Side. De noche."],[669.86,"N","Las velas parpadean. De un tambo de acero sale humo de dinero quemado. Las puertas se abren de golpe. Entra Macbeth con dos hombres armados. Sus ojos están salvajes. Ha visto demasiada sangre. Viene por respuestas.","Escena veintiséis. La bodega. De noche."],[682.77,"M","¿Qué pasa, brujas secretas, negras, de medianoche? ¿Qué están haciendo?","Escena veintiséis. La bodega. De noche."],[687.08,"W1","Una obra que no tiene nombre.","Escena veintiséis. La bodega. De noche."],[689.28,"M","Les ordeno, por lo que ustedes practican, como sea que lo sepan, respóndanme. ¿Reinará la sangre de Banquo en esta ciudad?","Escena veintiséis. La bodega. De noche."],[696.24,"W2","Habla.","Escena veintiséis. La bodega. De noche."],[697.31,"W3","Exige.","Escena veintiséis. La bodega. De noche."],[698.52,"W1","Nosotras responderemos.","Escena veintiséis. La bodega. De noche."],[700.49,"N","El humo se hace espeso. Dentro del fuego se forman figuras. Primera visión. Un soldado enmascarado, con heridas de bala en el pecho, se levanta del humo. Su voz es como grava.","Escena veintiséis. La bodega. De noche."],[711.02,"A1X","¡Macbeth! ¡Macbeth! ¡Macbeth! Cuídate de Macduff. Cuídate del hombre que huyó.","Escena veintiséis. La bodega. De noche."],[715.56,"M","Lo que sea. Díganme más.","Escena veintiséis. La bodega. De noche."],[717.43,"N","Segunda visión. Una figura en las sombras, con una pistola en la mano. Firme, como un hombre que no puede morir.","Escena veintiséis. La bodega. De noche."],[724.09,"A2X","Sé sangriento, atrevido y decidido. Búrlate del poder de los hombres, porque nadie nacido de mujer podrá hacerle daño a Macbeth.","Escena veintiséis. La bodega. De noche."],[732.37,"M","¡Entonces no le temo a nada! ¡Que Macduff haga lo peor que pueda!","Escena veintiséis. La bodega. De noche."],[736.33,"N","Tercera visión. Un niño con una corona de oro torcida en la cabeza. En la mano, un pequeño árbol. Su voz es tranquila. Lejana.","Escena veintiséis. La bodega. De noche."],[744.19,"A3X","Macbeth nunca será vencido, hasta que el gran bosque de Birnam suba hasta la colina de Dunsinane para pelear contra él.","Escena veintiséis. La bodega. De noche."],[751.7,"M","¡Eso nunca va a pasar! Nadie puede mover un bosque entero. Voy a reinar para siempre.","Escena veintiséis. La bodega. De noche."],[756.75,"N","El humo se aclara. Pero queda una última visión. Los descendientes de Banquo. Una fila de hombres, todos con corona, que se pierde hasta el infinito.","Escena veintiséis. La bodega. De noche."],[765.49,"M","¿¡Qué es esto!? ¡No! ¡Los hijos de Banquo nunca van a gobernar!","Escena veintiséis. La bodega. De noche."],[768.94,"W1","No busques saber más.","Escena veintiséis. La bodega. De noche."],[770.88,"N","El fuego se apaga de golpe. Silencio. Macbeth respira fuerte. Se voltea hacia sus hombres.","Escena veintiséis. La bodega. De noche."],[776.55,"M","¡Encuentren a la familia de Macduff! ¡Acaben con ellos!","Escena veintiséis. La bodega. De noche."]]},{"t":"CAPITULO 4","d":860.23,"c":[[0.0,"N","Una casa en los suburbios del South Side. Un jardín bien cuidado. Un carro en la entrada.","Escenas veintisiete y veintiocho. La casa de Macduff."],[5.55,"N","En la sala, Lady Macduff y su hijo pequeño. La televisión está bajita. Ella sabe que algo anda mal. Su esposo se fue. Las calles hablan. Llama a Macduff. El teléfono suena y suena. Nadie contesta.","Escenas veintisiete y veintiocho. La casa de Macduff."],[17.68,"LM","¿A dónde voy a huir? Yo no he hecho ningún daño. Pero ahora recuerdo que estoy en este mundo, donde hacer daño muchas veces se aplaude, y hacer el bien a veces se considera una locura peligrosa. Entonces, ¿de qué me sirve decir que no he hecho daño?","Escenas veintisiete y veintiocho. La casa de Macduff."],[31.63,"HJ","Mamá, ¿papá está en problemas?","Escenas veintisiete y veintiocho. La casa de Macduff."],[33.62,"LM","Tuvo que irse, mi amor. Pero no es un traidor. Es un hombre bueno.","Escenas veintisiete y veintiocho. La casa de Macduff."],[37.32,"N","¡Bang! ¡Golpes en la puerta! Ella se congela. El niño se endereza, con los ojos llenos de miedo.","Escenas veintisiete y veintiocho. La casa de Macduff."],[43.17,"HJ","¿Quién es?","Escenas veintisiete y veintiocho. La casa de Macduff."],[44.17,"N","Ella lo jala hacia ella. Ya lo sabe. La puerta revienta. Entran tres hombres enmascarados.","Escenas veintisiete y veintiocho. La casa de Macduff."],[49.93,"AS","¿Dónde está tu esposo?","Escenas veintisiete y veintiocho. La casa de Macduff."],[51.73,"LM","Espero que en ningún lugar tan maldito donde alguien como tú pueda encontrarlo.","Escenas veintisiete y veintiocho. La casa de Macduff."],[56.29,"AS","Entonces es hombre muerto.","Escenas veintisiete y veintiocho. La casa de Macduff."],[58.45,"LM","¿¡Qué hemos hecho!? ¡Somos inocentes!","Escenas veintisiete y veintiocho. La casa de Macduff."],[60.76,"HJ","¡Mientes, cobarde asqueroso!","Escenas veintisiete y veintiocho. La casa de Macduff."],[62.78,"N","Un disparo. Lady Macduff grita cuando su hijo cae. Se lanza contra el asesino. Otro disparo. Ella cae. La sangre se derrama sobre el piso de madera.","Escenas veintisiete y veintiocho. La casa de Macduff."],[71.86,"AS","Vámonos. Sin testigos.","Escenas veintisiete y veintiocho. La casa de Macduff."],[73.63,"N","Salen. Y la casa se queda en silencio.","Escenas veintisiete y veintiocho. La casa de Macduff."],[77.64,"N","Una oficina elegante en lo alto de un rascacielos. Malcolm, el joven príncipe del South Side, heredero del imperio de Duncan, ha estado moviéndose en silencio, juntando aliados.","Escena veintinueve. La oficina de Malcolm. De día."],[88.36,"N","Se abre la puerta. Entra Macduff, con la cara tensa y los pasos pesados. Todavía no sabe nada. Ross está cerca. Él sí lo sabe. Y teme lo que tiene que decir.","Escena veintinueve. La oficina de Malcolm. De día."],[98.06,"MA","Busquemos una sombra solitaria, y ahí lloremos hasta vaciar nuestro pecho triste.","Escena veintinueve. La oficina de Malcolm. De día."],[102.97,"F","No. Mejor agarremos fuerte la espada de la muerte, y como hombres buenos, defendamos nuestra tierra caída.","Escena veintinueve. La oficina de Malcolm. De día."],[108.89,"MA","Tú quisiste a Macbeth. Y yo soy joven, sin experiencia. ¿Cómo sé que no eres su hombre?","Escena veintinueve. La oficina de Malcolm. De día."],[113.83,"F","¡Tu título está confirmado! ¡Eres el heredero legítimo, el hijo de Duncan! Pero tengo que ser paciente, porque mi dolor...","Escena veintinueve. La oficina de Malcolm. De día."],[120.82,"R","Macduff... yo...","Escena veintinueve. La oficina de Malcolm. De día."],[122.13,"N","Macduff se tensa. Algo anda mal. Ross baja la mirada. Suspira. Y se obliga a decirlo.","Escena veintinueve. La oficina de Malcolm. De día."],[127.72,"R","Atacaron tu casa. Tu esposa y tus hijos... los mataron sin piedad.","Escena veintinueve. La oficina de Malcolm. De día."],[131.98,"N","Silencio. Macduff mira a Ross. Las palabras no le entran en la cabeza.","Escena veintinueve. La oficina de Malcolm. De día."],[136.71,"F","¿Mis hijos también?","Escena veintinueve. La oficina de Malcolm. De día."],[138.24,"R","Esposa, hijos, sirvientes. Todos los que encontraron.","Escena veintinueve. La oficina de Malcolm. De día."],[141.58,"N","Macduff da un paso atrás, como si le hubieran pegado en el estómago. Le tiemblan las manos.","Escena veintinueve. La oficina de Malcolm. De día."],[147.25,"F","¿Todos mis pequeños? ¿Dijiste todos? ¡Oh, ave del infierno! ¿Todos? ¿Qué? ¿Todos mis pollitos y su madre, de un solo golpe?","Escena veintinueve. La oficina de Malcolm. De día."],[154.13,"N","Un silencio largo. Aprieta los puños. Todo su cuerpo tiembla. Y el dolor se vuelve acero.","Escena veintinueve. La oficina de Malcolm. De día."],[159.92,"MA","Consuélate. Hagamos de nuestra venganza la medicina. Vamos a recuperar la ciudad.","Escena veintinueve. La oficina de Malcolm. De día."],[164.86,"F","Cara a cara. Ponme frente a ese demonio. A la distancia de mi espada. Y si se escapa, que el cielo lo perdone a él también.","Escena veintinueve. La oficina de Malcolm. De día."],[171.77,"N","Malcolm asiente. Es la hora.","Escena veintinueve. La oficina de Malcolm. De día."],[175.34,"N","La reina del imperio del North Side ya no manda. Camina de un lado a otro, inquieta, perseguida. Botellas a medio tomar en la barra de mármol. No ha dormido. Los muertos no la dejan en paz.","Escena treinta. El penthouse de Macbeth. De noche."],[186.31,"N","Murmura sola, frotándose las manos una y otra vez, como si quisiera quitarse algo invisible. En las sombras, un doctor y una sirvienta la vigilan.","Escena treinta. El penthouse de Macbeth. De noche."],[195.32,"DR","He velado dos noches contigo, y no veo nada de lo que me contaste. ¿Cuándo fue la última vez que caminó dormida?","Escena treinta. El penthouse de Macbeth. De noche."],[202.13,"SV","Desde que su alteza se fue a la guerra. Se levanta de la cama, se pone la bata, abre su armario, saca papeles, los dobla, escribe en ellos, los lee, y los vuelve a sellar. Todo eso, profundamente dormida.","Escena treinta. El penthouse de Macbeth. De noche."],[213.5,"N","Lady Macbeth se detiene. Sus ojos están perdidos. Pero sus manos... sus manos no paran. Las frota. Las restriega.","Escena treinta. El penthouse de Macbeth. De noche."],[220.46,"L","Todavía hay una mancha.","Escena treinta. El penthouse de Macbeth. De noche."],[222.32,"L","¡Fuera, mancha maldita! ¡Fuera, te digo! Una... dos... bueno, ya es hora de hacerlo. ¡El infierno es oscuro!","Escena treinta. El penthouse de Macbeth. De noche."],[228.34,"N","Voltea hacia un lugar vacío, como si alguien estuviera ahí.","Escena treinta. El penthouse de Macbeth. De noche."],[232.15,"L","¡Qué vergüenza, mi señor, qué vergüenza! ¿Un soldado, y con miedo? ¿Qué importa quién lo sepa, si nadie puede pedirle cuentas a nuestro poder? Pero, ¿quién iba a pensar que el viejo tenía tanta sangre?","Escena treinta. El penthouse de Macbeth. De noche."],[243.41,"L","El señor de Fife tenía una esposa. ¿Dónde está ahora? ¿Qué? ¿Estas manos nunca van a estar limpias?","Escena treinta. El penthouse de Macbeth. De noche."],[249.32,"N","Se mira en el vidrio de la ventana, pero ya no se reconoce. Se ríe como una niña. Con los ojos vacíos.","Escena treinta. El penthouse de Macbeth. De noche."],[255.73,"L","Todavía huele a sangre. Todos los perfumes de Arabia no van a endulzar esta manita. ¡Oh! ¡Oh! ¡Oh!","Escena treinta. El penthouse de Macbeth. De noche."],[261.38,"DR","¡Qué suspiro! Ese corazón está muy cargado.","Escena treinta. El penthouse de Macbeth. De noche."],[264.36,"L","Lávate las manos. Ponte la bata. No te veas tan pálido. Te lo vuelvo a decir: Banquo está enterrado. No puede salir de su tumba.","Escena treinta. El penthouse de Macbeth. De noche."],[271.54,"L","A la cama, a la cama. Están tocando la puerta. Ven, ven, ven, dame la mano. Lo hecho no se puede deshacer. A la cama, a la cama, a la cama.","Escena treinta. El penthouse de Macbeth. De noche."],[279.64,"N","Se derrumba en el colchón, hecha un ovillo, con los ojos vacíos. El doctor se pasa la mano por la cara.","Escena treinta. El penthouse de Macbeth. De noche."],[286.18,"DR","Ella necesita más a Dios que a un médico. ¡Dios, Dios, perdónanos a todos!","Escena treinta. El penthouse de Macbeth. De noche."],[292.27,"N","Humo. Olor a pólvora y gasolina. Los soldados que antes eran los más leales a Macbeth ahora susurran entre ellos. El imperio se está quebrando.","Escena treinta y uno. La bodega de Lennox. De noche."],[301.05,"N","Menteith, Caithness, Angus y Lennox rodean una mesa llena de planos, teléfonos y fajos de dinero. Esto es un plan de guerra.","Escena treinta y uno. La bodega de Lennox. De noche."],[308.74,"ME","Las fuerzas de Inglaterra están cerca, guiadas por Malcolm, su tío Siward y el buen Macduff. La venganza les arde por dentro.","Escena treinta y uno. La bodega de Lennox. De noche."],[316.36,"CA","Él está fortificando el gran Dunsinane. Unos dicen que está loco. Otros, que lo odian menos, lo llaman furia valiente. Pero lo seguro es que ya no puede controlar su causa enferma.","Escena treinta y uno. La bodega de Lennox. De noche."],[327.03,"LE","Ahora siente sus asesinatos secretos pegados a las manos. Los que él manda solo se mueven por órdenes, nada por amor. Ahora siente que su título le queda flojo, como la túnica de un gigante sobre un ladrón enano.","Escena treinta y uno. La bodega de Lennox. De noche."],[338.82,"AN","Marchemos hacia Birnam. Marchemos hacia Dunsinane.","Escena treinta y uno. La bodega de Lennox. De noche."],[342.15,"N","Silencio. Y luego, uno por uno, todos asienten. Menteith revisa el cargador de su pistola.","Escena treinta y uno. La bodega de Lennox. De noche."],[347.94,"ME","Vamos a encontrarnos con la medicina para esta tierra enferma, y con él derramaremos, para purgar a nuestra patria, hasta la última gota de nosotros.","Escena treinta y uno. La bodega de Lennox. De noche."],[356.55,"N","Esto es todo. El North Side va a arder.","Escena treinta y uno. La bodega de Lennox. De noche."],[360.62,"N","Botellas rotas. Muebles volteados. La paranoia se lo comió. Macbeth camina armado de un lado a otro. Sus hombres se miran nerviosos. Ya escucharon los rumores. El South Side viene.","Escena treinta y dos. El penthouse de Macbeth. De noche."],[371.62,"M","¡No me traigan más reportes! ¡Que se vayan todos! Hasta que el bosque de Birnam llegue a Dunsinane, no voy a tener miedo. ¿Quién es el muchacho Malcolm? ¿No nació de mujer? Los espíritus que conocen el destino de los mortales me lo dijeron: No temas, Macbeth. Ningún hombre nacido de mujer tendrá poder sobre ti.","Escena treinta y dos. El penthouse de Macbeth. De noche."],[388.46,"N","Se ríe solo. Una risa salvaje.","Escena treinta y dos. El penthouse de Macbeth. De noche."],[391.07,"M","¡Entonces huyan, falsos señores! ¡Vayan a juntarse con los de Inglaterra! La mente que me gobierna y el corazón que cargo nunca se van a doblar con dudas, ni a temblar de miedo.","Escena treinta y dos. El penthouse de Macbeth. De noche."],[401.54,"N","Tocan la puerta. Entra Seyton, su mano derecha.","Escena treinta y dos. El penthouse de Macbeth. De noche."],[405.01,"SE","El South Side se está moviendo, jefe. Malcolm, Macduff, vienen con todo. Todos están hablando. Ya nadie está con nosotros.","Escena treinta y dos. El penthouse de Macbeth. De noche."],[412.1,"M","¡Quita tu cara de aquí!","Escena treinta y dos. El penthouse de Macbeth. De noche."],[413.95,"M","Me duele el corazón cuando veo... ¡Seyton, te digo! Este empujón me va a alegrar para siempre, o me va a tumbar ahora. He vivido suficiente. Mi vida ya cayó en el otoño, en la hoja amarilla. Y lo que debería acompañar a la vejez, el honor, el amor, la obediencia, los amigos, eso ya no lo puedo esperar.","Escena treinta y dos. El penthouse de Macbeth. De noche."],[430.3,"N","Por primera vez, algo en su voz se quiebra. Lo perdió todo. Pero tan rápido como llega, desaparece.","Escena treinta y dos. El penthouse de Macbeth. De noche."],[436.61,"M","Dame mi armadura.","Escena treinta y dos. El penthouse de Macbeth. De noche."],[438.18,"SE","Todavía no hace falta...","Escena treinta y dos. El penthouse de Macbeth. De noche."],[440.05,"M","¡Voy a pelear hasta que me arranquen la carne de los huesos! ¡Dame mi armadura!","Escena treinta y dos. El penthouse de Macbeth. De noche."],[444.48,"N","Macbeth mira por la ventana su ciudad. La guerra llegó. Y él está listo para morir por su trono.","Escena treinta y dos. El penthouse de Macbeth. De noche."],[451.66,"N","Faroles que parpadean. Malcolm, Macduff y Siward estudian un mapa del North Side. Una fila de camionetas negras con los motores encendidos. Las cajuelas se abren. Cajas llenas de armas.","Escena treinta y tres. Un estacionamiento abandonado del South Side. De noche."],[463.05,"MA","Primos, espero que se acerquen los días en que nuestras casas vuelvan a ser seguras.","Escena treinta y tres. Un estacionamiento abandonado del South Side. De noche."],[467.97,"SW","¿Qué bosque es este frente a nosotros?","Escena treinta y tres. Un estacionamiento abandonado del South Side. De noche."],[470.56,"F","El bosque de Birnam.","Escena treinta y tres. Un estacionamiento abandonado del South Side. De noche."],[472.11,"N","Las cajas de armas llevan escrito un nombre: Birnam. Así han metido las armas a escondidas.","Escena treinta y tres. Un estacionamiento abandonado del South Side. De noche."],[477.93,"MA","Que cada soldado corte una rama y la cargue frente a él. Así esconderemos cuántos somos, y los espías se equivocarán en sus reportes.","Escena treinta y tres. Un estacionamiento abandonado del South Side. De noche."],[485.82,"SL","Así se hará.","Escena treinta y tres. Un estacionamiento abandonado del South Side. De noche."],[487.01,"SW","Lo único que sabemos es que el tirano, muy confiado, se queda en Dunsinane, y va a aguantar nuestro ataque.","Escena treinta y tres. Un estacionamiento abandonado del South Side. De noche."],[493.48,"F","Que nuestro juicio espere al resultado verdadero. Y ahora, a pelear como buenos soldados.","Escena treinta y tres. Un estacionamiento abandonado del South Side. De noche."],[498.94,"N","Los motores rugen. Las camionetas salen. Van por Macbeth.","Escena treinta y tres. Un estacionamiento abandonado del South Side. De noche."],[504.19,"N","La tensión ahoga. Macbeth, armado y con chaleco, camina sin parar. Sus soldados se están yendo, cambiando de bando, desapareciendo.","Escena treinta y cuatro. El penthouse de Macbeth. De noche."],[512.6,"N","¡Bum! Una explosión lejana sacude los vidrios. Disparos en la calle. El South Side llegó. Seyton entra sin aire, con un radio en la mano.","Escena treinta y cuatro. El penthouse de Macbeth. De noche."],[520.79,"SE","La reina, mi señor, ha muerto.","Escena treinta y cuatro. El penthouse de Macbeth. De noche."],[522.96,"N","Macbeth se detiene. Su cara es de piedra. Mira el suelo.","Escena treinta y cuatro. El penthouse de Macbeth. De noche."],[526.68,"M","Debió morir más adelante. Habría habido un tiempo para esa palabra. Mañana, y mañana, y mañana, se arrastran a este paso pequeño, de día en día, hasta la última sílaba del tiempo escrito. Y todos nuestros ayeres les han alumbrado a los tontos el camino hacia la muerte polvorienta.","Escena treinta y cuatro. El penthouse de Macbeth. De noche."],[542.82,"M","¡Apágate, apágate, vela breve! La vida no es más que una sombra que camina. Un pobre actor que se pavonea y se angustia su hora en el escenario, y luego nunca más se le escucha. Es un cuento contado por un idiota, lleno de ruido y de furia, que no significa nada.","Escena treinta y cuatro. El penthouse de Macbeth. De noche."],[557.78,"N","Silencio. Y de pronto, ¡bum! Una camioneta del South Side se estrella contra la reja principal. ¡Disparos!","Escena treinta y cuatro. El penthouse de Macbeth. De noche."],[564.42,"SE","¡Jefe, ya vienen!","Escena treinta y cuatro. El penthouse de Macbeth. De noche."],[565.87,"M","¡A las armas, a las armas, y afuera! No hay para dónde huir, ni dónde quedarse. Empiezo a cansarme del sol, y quisiera que el orden del mundo se deshiciera. ¡Suenen la alarma!","Escena treinta y cuatro. El penthouse de Macbeth. De noche."],[575.56,"N","Una sirena aúlla por todo el edificio. Macbeth se pone el chaleco, carga su arma, y sale. Si el South Side quiere guerra, les va a dar guerra.","Escena treinta y cuatro. El penthouse de Macbeth. De noche."],[585.41,"N","Balas por toda la calle. Los hombres caen como moscas. Es una zona de guerra. Las camionetas frenan de golpe. Malcolm, Macduff y Siward bajan con las armas en la mano.","Escena treinta y cinco. La batalla final."],[595.58,"M","Ya están bastante cerca. Tiren sus pantallas de hojas, y muéstrense como son.","Escena treinta y cinco. La batalla final."],[600.52,"N","El engaño se acabó. Las cajas de Birnam están abiertas. Los soldados del South Side salen completamente armados.","Escena treinta y cinco. La batalla final."],[607.89,"SW","Tú, noble señor, tienes esperanza de una gran venganza. Macbeth está maduro para caer, y los poderes del cielo ya preparan sus armas.","Escena treinta y cinco. La batalla final."],[616.28,"F","¡Que hablen todas nuestras trompetas! ¡Denles todo el aliento a esos mensajeros ruidosos de sangre y muerte!","Escena treinta y cinco. La batalla final."],[622.75,"N","¡Una explosión enorme revienta las puertas del penthouse! ¡Humo! ¡Gritos! ¡Alarmas!","Escena treinta y cinco. La batalla final."],[627.73,"N","Adentro reina el caos. Macbeth avanza entre los escombros, con el arma en la mano y la camisa salpicada de sangre. Sus soldados están muertos o cambiaron de bando. Pero él no se rinde.","Escena treinta y cinco. La batalla final."],[638.82,"M","Me amarraron a una estaca. No puedo huir. Como un oso, tengo que pelear hasta el final. ¿Quién es el que no nació de mujer? A ese es al único que debo temer. A nadie más.","Escena treinta y cinco. La batalla final."],[648.0,"N","¡Una puerta revienta! Entra un soldado del South Side. Macbeth gira y dispara. El soldado cae.","Escena treinta y cinco. La batalla final."],[653.99,"SW","Por aquí, mi señor. El castillo se está rindiendo. La gente del tirano pelea en los dos bandos. El día casi se declara tuyo.","Escena treinta y cinco. La batalla final."],[661.77,"MA","Nos encontramos con enemigos que pelean a nuestro lado.","Escena treinta y cinco. La batalla final."],[665.16,"N","Macbeth entra tropezando a la sala. Voltea el sofá. Toma un trago largo de whisky. Recarga. Su última pelea se acerca. La puerta se abre despacio. Entra Macduff, con el arma levantada.","Escena treinta y cinco. La batalla final."],[676.41,"F","¡Voltéate, perro del infierno, voltéate!","Escena treinta y cinco. La batalla final."],[679.09,"M","De todos los hombres, a ti te he evitado. Pero vete. Mi alma ya está demasiado cargada con la sangre de los tuyos.","Escena treinta y cinco. La batalla final."],[685.97,"F","No tengo palabras. Mi voz está en mi espada. ¡Eres un villano más sangriento de lo que cualquier palabra puede decir!","Escena treinta y cinco. La batalla final."],[692.82,"N","¡Dispara! Macbeth se lanza detrás de un sofá. Se levanta disparando. Las balas atraviesan las paredes. Se rodean el uno al otro. Macbeth casi no tiene balas. Pero todavía se cree intocable. Y sonríe.","Escena treinta y cinco. La batalla final."],[704.99,"M","Pierdes tu tiempo. Es tan fácil cortar el aire con tu espada como hacerme sangrar. Ataca cabezas que se puedan herir. Yo tengo una vida encantada, que no se rinde ante ningún nacido de mujer.","Escena treinta y cinco. La batalla final."],[716.53,"F","Desespera de tu encanto. Y que el ángel al que siempre has servido te diga que a Macduff lo arrancaron antes de tiempo del vientre de su madre.","Escena treinta y cinco. La batalla final."],[724.45,"N","Silencio. La sonrisa de Macbeth se cae. Por primera vez, tiembla.","Escena treinta y cinco. La batalla final."],[728.72,"M","¡Maldita sea la lengua que me dice eso, porque le ha quitado el valor a la mejor parte de mi hombría! Y que nadie vuelva a creer a esos demonios tramposos, que nos engañan con palabras dobles, que cumplen la promesa en el oído, y la rompen en la esperanza.","Escena treinta y cinco. La batalla final."],[742.9,"N","Macduff se lanza. Macbeth dispara su última bala. ¡Falla! Macduff le tumba el arma. ¡Chocan! Puños, codos, desesperación. Macbeth saca un cuchillo. Macduff le agarra la muñeca y se la tuerce. ¡Lo estrella contra la ventana! El vidrio se agrieta como una telaraña.","Escena treinta y cinco. La batalla final."],[758.35,"M","No me voy a rendir para besar el suelo ante los pies del joven Malcolm, ni para que me maldiga la multitud. Aunque el bosque de Birnam haya llegado a Dunsinane, y tú, que no naciste de mujer, estés frente a mí, voy a intentarlo hasta el final.","Escena treinta y cinco. La batalla final."],[771.92,"N","Con un último rugido, Macbeth se lanza. Macduff se hace a un lado, gira, y lo atraviesa. Macbeth se ahoga. Sus ojos se nublan.","Escena treinta y cinco. La batalla final."],[779.64,"M","Ataca, Macduff. ¡Y maldito sea el primero que grite: ya basta!","Escena treinta y cinco. La batalla final."],[783.46,"N","Macduff saca el cuchillo. Macbeth retrocede. Su espalda choca con el vidrio roto. Y cae. Su cuerpo desaparece en la noche. El tirano ha muerto.","Escena treinta y cinco. La batalla final."],[792.36,"N","Afuera, se acaban los disparos. El humo todavía flota. Malcolm camina entre los escombros. Macduff se acerca con sangre en las manos. Y en su mano, la cadena de Macbeth. El símbolo del poder del North Side.","Escena treinta y cinco. La batalla final."],[804.49,"MA","Ojalá los amigos que nos faltan hubieran llegado a salvo.","Escena treinta y cinco. La batalla final."],[808.02,"F","¡Salve, rey! Porque eso eres. El tiempo es libre. Te veo rodeado de las perlas de tu reino, que en su mente dicen mi saludo. ¡Y quiero que lo griten conmigo! ¡Salve, Rey del South Side!","Escena treinta y cinco. La batalla final."],[818.22,"TD","¡Salve, Rey del South Side!","Escena treinta y cinco. La batalla final."],[820.3,"N","Malcolm toma la cadena. La aprieta fuerte. Es todo lo que Macbeth construyó, y todo lo que destruyó.","Escena treinta y cinco. La batalla final."],[826.43,"MA","No pasará mucho tiempo antes de que les pague a cada uno su amor y su lealtad. Mis señores y parientes, desde hoy serán condes, los primeros del South Side con ese honor.","Escena treinta y cinco. La batalla final."],[836.15,"MA","Así que gracias a todos, y a cada uno, a quienes invitamos a vernos coronado en el Club Plex.","Escena treinta y cinco. La batalla final."],[841.82,"N","La multitud explota. El South Side reina. Y a lo lejos, el edificio de Macbeth, roto, oscuro, muerto. El North Side se acabó.","Escena treinta y cinco. La batalla final."],[849.8,"N","Y así termina Macbeth, Reinado Urbano. De TJ Wright y William Shakespeare. Gracias por escuchar Radio Novela noventa y ocho punto cinco.","Escena treinta y cinco. La batalla final."]]}]/*NOV_CUES*/;

/* ---------- 1310 MONEY MOVES: real money education (general, not personal advice) ---------- */
const DISC=['A',"Quick reminder: this show is education, not personal financial advice. Everybody's situation is different, so talk to a licensed professional before big decisions."];
const LESSONS=[
 ["Lesson one, before anything else: the emergency fund. A common target is three to six months of your essential bills, sitting somewhere safe and easy to reach, like a high-yield savings account.","Because life happens. The car breaks down, hours get cut. Without that cushion, people end up on credit cards at twenty-plus percent interest."],
 ["Pay yourself first. On payday, before you spend anything, move a set amount into savings automatically.","Even twenty-five dollars a check. The habit matters more than the amount at the start. Automate it so you never have to think about it."],
 ["A simple budget to start with is fifty, thirty, twenty. Fifty percent of take-home pay to needs, thirty to wants, twenty to savings and paying down debt.","It's a starting point, not a law. In a high-rent city you may have to adjust. The point is to tell your money where to go instead of wondering where it went."],
 ["Let's talk compound interest. Say you invest one hundred dollars a month and it grows at seven percent a year on average. After thirty years that's around one hundred twenty-two thousand dollars.","And only thirty-six thousand of that is money you put in. The rest is growth on growth. Now, seven percent is an illustration, not a promise. Markets go up and down, sometimes hard."],
 ["The rule of seventy-two. Divide seventy-two by your interest rate to estimate how many years it takes money to double.","At eight percent, about nine years. And it works against you too: credit card debt at twenty-four percent doubles in about three years if you don't pay it."],
 ["Your credit score. The biggest factor in a FICO score is payment history, about thirty-five percent. Pay on time, every time. Set up autopay for at least the minimum.","Next biggest is how much of your available credit you're using, about thirty percent. A lot of experts say keep it under thirty percent of your limit, and lower is better."],
 ["You can check your credit reports for free from all three bureaus, Equifax, Experian and TransUnion, at AnnualCreditReport dot com.","That's the official site. Look for accounts you don't recognize. Mistakes happen, and you have the right to dispute them."],
 ["Paying off debt. Two popular methods. The avalanche: pay minimums on everything, then throw extra money at the highest interest rate first. Mathematically it saves the most.","The snowball: pay off the smallest balance first for a quick win, then roll that payment into the next one. It can cost a little more, but the momentum keeps a lot of people going. The best plan is the one you stick to."],
 ["Be careful with payday loans. The fees can work out to an annual rate of around four hundred percent.","If you're short, call the lender or landlord, ask about a payment plan, or check with a local credit union about small-dollar loans."],
 ["If your job offers a 401k match, try to contribute at least enough to get the full match.","If your employer matches fifty cents on the dollar up to six percent of your pay, that's an instant fifty percent return on that money. Leaving it on the table is leaving pay on the table."],
 ["Roth versus traditional retirement accounts. With a Roth, you pay tax on the money now, and qualified withdrawals in retirement are tax-free.","With traditional, you may get a tax break now and pay tax when you take it out later. Contribution limits and income rules change, so check IRS dot gov for this year's numbers."],
 ["Index funds. Instead of betting on one company, an index fund owns a little piece of a whole market, like the five hundred big companies in the S and P 500.","Watch the expense ratio, that's the yearly fee. One percent versus point-zero-five percent sounds small, but over thirty years it can be tens of thousands of dollars."],
 ["Diversification means don't put all your eggs in one basket. One stock, one coin, one business. If it goes to zero, so do you.","Spread it out across a lot of companies and types of investments, so one bad bet doesn't sink you."],
 ["Dollar-cost averaging: investing the same amount on a schedule, every payday, no matter what the market is doing.","You buy more shares when prices are low and fewer when they're high. And it takes your emotions out of it. Fear and hype are expensive."],
 ["Inflation. When prices rise, every dollar buys less. Cash under the mattress quietly loses value every year.","That's why money you won't need for years usually needs to be invested somewhere it can grow, while short-term money stays safe and reachable."],
 ["Side hustle money. If you're self-employed, you generally owe self-employment tax, fifteen point three percent for Social Security and Medicare, on top of income tax.","So set aside a chunk of every payment for taxes, and look into quarterly estimated payments so April isn't a disaster. A tax professional is worth it here."],
 ["Scam alert. Red flags: guaranteed high returns, pressure to act right now, and anybody asking to be paid in gift cards, wire transfers or crypto.","If it sounds too good to be true, it is. Real investments come with risk, and real professionals don't rush you."],
 ["Buying a car? Don't shop by the monthly payment. Shop by the total price.","An eighty-four month loan can make an expensive car look cheap per month, while you pay way more interest, and owe more than it's worth for years."],
 ["Know your net worth. Add up what you own, subtract what you owe. Check it every few months.","It's the scoreboard. Income is what you make. Net worth is what you keep."],
 ["Business owners: open a separate business bank account. Don't mix business and personal money.","Keep every receipt. And talk to a lawyer or CPA about whether an LLC or other structure makes sense to protect your personal assets."],
 ["Renting versus buying. When you own, you pay for repairs. A common rule of thumb is to budget one to two percent of the home's value every year for maintenance.","Plus closing costs, insurance and property taxes, and Texas property taxes are no joke. Buying can build wealth, but it's not automatically better than renting."],
 ["Insurance protects what you build. Renters insurance is often inexpensive and can cover your stuff if there's a fire or break-in.","Health, auto, and if people depend on your income, look into term life insurance. Building wealth means protecting it too."]];
const ASK=[["Grace, I'm twenty-two, I make about forty thousand a year. Where do I even start?","Start with a small emergency fund, a thousand dollars. Then grab any 401k match, then attack high-interest debt, then build the full emergency fund. One step at a time."],
 ["I just got a big tax refund. Should I spend it?","Treat yourself a little, that's fine. Then put it to work: emergency fund, high-interest debt, or retirement. And next year, a huge refund means you overpaid all year. You can adjust your withholding."],
 ["My partner and I fight about money. What do we do?","Sit down when nobody's upset. Lay out every bill and every debt, no secrets. Pick shared goals. A lot of couples use a joint account for bills and separate accounts for personal spending."],
 ["Everybody online says to buy whatever coin is hot. Should I?","Never invest money you can't afford to lose in anything that swings that hard. Hype is not a strategy. Build your foundation first."]];
function moneyGen(n){const L=[];if(n%6===0)L.push(['A',"Welcome to Money Moves on 1310. I'm Dr. Grace."],['B',"And I'm Paul. Real money talk, no hype. Let's get your bag right."],DISC);

  else if(n%9===5&&P&&P.w)L.push(['B',"Grace, people around Houston keep buying businesses. Records shops, car washes, taco spots."],['A',"Love it. Cash flow is king. If your business pays you every morning, don't spend it all. Reinvest some, save some. That's how one business becomes three."]);
  else{const l=LESSONS[n%LESSONS.length];L.push(['A',l[0]],['B',l[1]]);}
  return L;}

const REAL=[
 ['Episode 1: Talk so they can hear you',[["Today, communication. Here's the big one: start with I, not you. I feel ignored when plans change last minute, instead of, you never think about me.","Because you-statements sound like an attack, and people defend instead of listening."],["And listen to understand, not to reload. Repeat back what you heard before you answer.","So what I'm hearing is you felt left out. That one sentence can calm a whole argument down."]]],
 ['Episode 2: The four fight killers',[["Relationship researcher John Gottman found four patterns that predict trouble. He calls them the four horsemen: criticism, contempt, defensiveness and stonewalling.","Contempt is the worst one. Eye rolls, mocking, acting like you're better than them. That poisons everything."],["The fix for each: complain about the behavior, not the person. Show appreciation. Take responsibility for your part. And if you're flooded, take a break, then come back.","Twenty minutes to cool off. But you have to actually come back. Walking away for good isn't a break."]]],
 ['Episode 3: Boundaries are not walls',[["A boundary is what you will do, not what you control them doing. I'm not going to stay on the phone if I'm being yelled at.","Then you follow through, calmly. No boundary works if you never keep it."],["And healthy people respect a no. If somebody punishes you every time you set a boundary, pay attention to that.","Boundaries keep the relationship safe. They're not the enemy of love."]]],
 ['Episode 4: How to really apologize',[["A real apology has three parts. Name what you did. Own how it hurt them. Say what you'll do differently.","No buts. I'm sorry, but, cancels everything before it."],["And then actually change the behavior. An apology without change is just a speech.","Trust is rebuilt in small promises kept, over and over."]]],
 ['Episode 5: Red flags',[["Let's talk red flags. Somebody who checks your phone, controls your money, cuts you off from friends and family, or threatens you. That's not love. That's control.","Jealousy that turns into rules about where you can go and who you can see is a warning sign."],["If you ever feel unsafe, you're not alone. In the US you can reach the National Domestic Violence Hotline at 1-800-799-7233, or text START to 88788.","Save that number. For yourself or a friend. It's free and confidential."]]],
 ['Episode 6: Money and love',[["Money is one of the top things couples fight about. Talk about it early. Debt, credit, spending habits, goals.","Not on the first date. But before you move in together or merge anything, yes."],["Try a monthly money date. Pick a time, look at the numbers together, no judgment, and plan.","Teamwork. You're not opponents. You're two people against the problem."]]],
 ['Episode 7: Love languages',[["A popular idea from author Gary Chapman: people show and feel love in different ways. Words, time, gifts, acts of service, and touch.","It's a pop framework, not hard science, but it starts a good conversation. Ask your partner what makes them feel loved."],["Because you might be washing their car every Saturday while they're starving for one honest compliment.","Same love, different language. Learn theirs."]]],
 ['Episode 8: Jealousy',[["A little jealousy is human. What you do with it is what matters.","Say it: I felt insecure when that happened. Don't go through their phone. Don't make it their job to fix all your fears."],["If insecurity is running your life, that might be something to work on with a counselor. That's strength, not weakness.","Therapy is maintenance. Like an oil change for your mind."]]],
 ['Episode 9: Ending it with respect',[["Sometimes it's over. Do it face to face if it's safe, be clear, and don't leave false hope.","Don't ghost somebody you've been with for a year. They deserve a real ending."],["And if it isn't safe, your safety comes first. Tell a trusted friend, have a plan, and reach out to the hotline from episode five.","Then give yourself time to grieve. You're allowed to miss something that wasn't good for you."]]],
 ['Episode 10: Friendships count too',[["Friendships need the same care. Check in. Show up. Celebrate their wins without competing.","The friend who's happy for you when you're winning? Keep that one."],["And not every friendship lasts forever. Some are for a season. You can let them go with love.","Quality over quantity. Three real ones beat thirty fake ones."]]],
 ['Episode 11: Macbeth and pressure',[["We have to talk about Macbeth. Lady Macbeth pushes him hard. She questions his manhood until he does something terrible.","That's not support. That's pressure. A real partner pushes you to be better, not to betray who you are."],["And Macbeth didn't take responsibility. He blamed the prophecy, the witches, everybody but himself.","Your choices are yours. Nobody can make you do something you know is wrong. Pick people who bring out your best."]]],
 ['Episode 12: Choosing well',[["How do you choose a good partner? Watch how they treat people who can't do anything for them. The waiter. Their mother. Strangers.","Watch what they do when they're angry. Watch if their words and actions match."],["And be the person you're looking for. Work on you while you wait.","That's the show. Love y'all. Real talk."]]]];

    case'flight':updFlight();break;
    case'jail':updJail();break;
    case'world':updWorld();break;

    case'choice':updChoice();break;

}
